# Sample credentials for the local Minikube demo only.
# For anything real, create the Secret from the CLI or a secrets manager
# and keep it out of git (see README).
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: flask-mongo
type: Opaque
stringData:
  # Root/admin user, created by the mongo image on first start
  MONGO_INITDB_ROOT_USERNAME: admin
  MONGO_INITDB_ROOT_PASSWORD: AdminPass123
  # Least-privilege user the Flask app connects with (readWrite on flask_db only)
  MONGO_APP_USERNAME: flaskuser
  MONGO_APP_PASSWORD: FlaskPass123
