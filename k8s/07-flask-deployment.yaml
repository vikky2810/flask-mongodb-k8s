apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: flask-mongo
  labels:
    app: flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask-app
          # Built locally and loaded into Minikube. To use a registry instead,
          # change to <your-dockerhub-user>/flask-mongodb-app:1.0 (see README).
          image: flask-mongodb-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            # Service DNS name; resolves via CoreDNS to the MongoDB pod
            - name: MONGO_HOST
              value: mongodb.flask-mongo.svc.cluster.local
            - name: MONGO_PORT
              value: "27017"
            - name: MONGO_DB_NAME
              value: flask_db
            - name: MONGO_AUTH_DB
              value: flask_db
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_APP_USERNAME
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_APP_PASSWORD
          resources:
            requests:
              cpu: 200m
              memory: 250M
            limits:
              cpu: 500m
              memory: 500M
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
